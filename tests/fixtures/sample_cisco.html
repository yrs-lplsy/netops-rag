  <h1>VLAN Configuration Guide</h1>
  <h2>Configuring VLANs</h2>
  <p>To create a VLAN, use the following command.</p>
  <pre><code>Device&gt; enable
Device# configure terminal
Device(config)# vlan 20
Device(config-vlan)# name test20
Device(config-vlan)# end</code></pre>
  <table><tr><th>Command</th><th>Description</th></tr>
  <tr><td>vlan <em>id</em></td><td>Creates a VLAN</td></tr></table>
