! netops lab 基线配置 — core2（FRR 10.4）
! 接口顺序 = 拓扑链接顺序（eth0 为 clab mgmt）：
!   eth1 -> core1, eth2 -> acc1, eth3 -> acc2
frr version 10.4
frr defaults traditional
hostname core2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 description P2P:core2-core1
 ip address 10.0.12.2/30
 ip ospf network point-to-point
!
interface eth2
 description P2P:core2-acc1
 ip address 10.0.201.1/30
 ip ospf network point-to-point
!
interface eth3
 description P2P:core2-acc2
 ip address 10.0.202.1/30
 ip ospf network point-to-point
!
router ospf
 ospf router-id 10.255.0.2
 network 10.0.12.0/30 area 0
 network 10.0.201.0/30 area 0
 network 10.0.202.0/30 area 0
 passive-interface lo
!
line vty
!
end
