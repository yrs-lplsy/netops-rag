version: t14-phase1
description: 30 条端到端排障评测任务（5 类故障 × lab 可表达变体；分布 shutdown6/cost7/desc9/avw6/no_vlan2——no_vlan 物理上限 2：基线仅一对
  VLAN100 子接口；待人工校准后跑全量）
schema: '{task_id, fault:{host,kind,param}, question, expected_conclusion, expected_tools, difficulty}'
tasks:
- task_id: t01
  fault:
    host: core1
    kind: shutdown_interface
    param:
      iface: eth2
  question: core1 与 acc1 之间的 OSPF 邻居关系突然断了，这条链路好像不通了，帮我看看接口状态
  expected_conclusion: core1 的 eth2 接口被管理性 shutdown
  expected_tools:
  - show_ospf_neighbor
  - show_ip_interface_brief
  - get_running_config
  difficulty: medium
- task_id: t02
